name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # -----------------------------------------------------------------------
  # Stage 1: Fast checks (no AWS, no ARM64 hardware)
  # -----------------------------------------------------------------------

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Experiment interface integration tests
        run: python3 -m unittest discover -s tests -p test_experiment.py -v

      - name: Check shared header compiles
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -fsyntax-only \
            -Iinclude -xc - < include/owlbear_events.h

      - name: Verify event struct size
        run: |
          cat > /tmp/check_size.c << 'CEOF'
          #include "owlbear_events.h"
          int main(void) { return 0; }
          CEOF
          gcc -std=c11 -Wall -Werror -Iinclude -o /tmp/check_size /tmp/check_size.c

  cross-compile:
    name: ARM64 cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo dpkg --add-architecture arm64
          for f in /etc/apt/sources.list.d/ubuntu*.sources; do
            [ -f "$f" ] && sudo sed -i '/^Architectures:/d; /^Types:/a Architectures: amd64' "$f" 2>/dev/null || true
          done
          cat <<ARMSRC | sudo tee /etc/apt/sources.list.d/arm64-ports.list
          deb [arch=arm64] http://ports.ubuntu.com/ $(lsb_release -cs) main universe
          deb [arch=arm64] http://ports.ubuntu.com/ $(lsb_release -cs)-updates main universe
          ARMSRC
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            libncurses-dev:arm64

      - name: Build game
        run: make game CROSS_COMPILE=aarch64-linux-gnu- CC=aarch64-linux-gnu-gcc

      - name: Build cheats
        run: make cheats CROSS_COMPILE=aarch64-linux-gnu- CC=aarch64-linux-gnu-gcc

  platform-tests:
    name: Platform tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install boto3

      - name: Run handler tests
        working-directory: platform/api
        run: python -m unittest tests.test_handler -v

  # Terraform configuration checks do not contact AWS or read remote state.
  # Provisioning and deployment are manual operations; see deploy/terraform/README.md.
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.7.5"

      - name: Terraform Init (without backend)
        working-directory: deploy/terraform/environments/dev
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        working-directory: deploy/terraform/environments/dev
        run: terraform validate -no-color
