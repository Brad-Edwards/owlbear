name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ground-control:
    name: Ground Control configuration and Phase E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.4'
      - name: Install the public YAML parser
        run: npm install --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/gc-config-tests" js-yaml@4.3.2
      - name: Validate schema 1 and finalization boundaries
        env:
          YAML_PACKAGE_ROOT: ${{ runner.temp }}/gc-config-tests/node_modules/js-yaml
        run: node --test tests/test_ground_control.mjs

  # -----------------------------------------------------------------------
  # Stage 1: Fast checks (no AWS, no ARM64 hardware)
  # -----------------------------------------------------------------------

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Experiment interface integration tests
        run: python3 -m unittest discover -s tests -p test_experiment.py -v

      - name: Qualification caller tests
        run: python3 -m unittest discover -s tests -p 'test_qualification_*.py' -v

      - name: Check shared header compiles
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -fsyntax-only \
            -Iinclude -xc - < include/owlbear_events.h

      - name: Verify event struct size
        run: |
          cat > /tmp/check_size.c << 'CEOF'
          #include "owlbear_events.h"
          int main(void) { return 0; }
          CEOF
          gcc -std=c11 -Wall -Werror -Iinclude -o /tmp/check_size /tmp/check_size.c

  bigrae-adapter:
    name: Independent BigRAE adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install independently published SDK and adapter wheels
        run: |
          python - <<'PYSDK'
          import hashlib,json,pathlib
          root=pathlib.Path('adapters/bigrae')
          sdk=json.loads((root/'sdk.json').read_text())
          assert hashlib.sha256((root/'vendor'/sdk['wheel']).read_bytes()).hexdigest()==sdk['wheel_sha256']
          PYSDK
          python -m pip wheel --no-deps --wheel-dir /tmp/adapter-wheels adapters/bigrae
          python -m venv /tmp/adapter-runtime
          /tmp/adapter-runtime/bin/pip install adapters/bigrae/vendor/*.whl /tmp/adapter-wheels/*.whl
      - name: Test installed adapter and SDK worker
        run: /tmp/adapter-runtime/bin/python -I -m unittest discover -s adapters/bigrae/tests -v

  bigrae-worker-release:
    name: BigRAE worker and guest integration
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Install image archive tool
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends skopeo
      - name: Build exact worker and test SDK and guest execution
        run: python3 adapters/bigrae/release.py --output /tmp/owlbear-worker-release --guest-integration
      - uses: actions/upload-artifact@v4
        with:
          name: owlbear-bigrae-worker-arm64
          path: |
            /tmp/owlbear-worker-release/worker.tar
            /tmp/owlbear-worker-release/wheelhouse/*.whl
            /tmp/owlbear-worker-release/*.json
            /tmp/owlbear-worker-release/requirements.lock
            /tmp/owlbear-worker-release/SHA256SUMS
          if-no-files-found: error

  cross-compile:
    name: ARM64 cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo dpkg --add-architecture arm64
          for f in /etc/apt/sources.list.d/ubuntu*.sources; do
            [ -f "$f" ] && sudo sed -i '/^Architectures:/d; /^Types:/a Architectures: amd64' "$f" 2>/dev/null || true
          done
          cat <<ARMSRC | sudo tee /etc/apt/sources.list.d/arm64-ports.list
          deb [arch=arm64] http://ports.ubuntu.com/ $(lsb_release -cs) main universe
          deb [arch=arm64] http://ports.ubuntu.com/ $(lsb_release -cs)-updates main universe
          ARMSRC
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            libncurses-dev:arm64

      - name: Build game
        run: make game CROSS_COMPILE=aarch64-linux-gnu- CC=aarch64-linux-gnu-gcc

      - name: Build cheats
        run: make cheats CROSS_COMPILE=aarch64-linux-gnu- CC=aarch64-linux-gnu-gcc

  platform-tests:
    name: Platform tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install boto3

      - name: Run handler tests
        working-directory: platform/api
        run: python -m unittest tests.test_handler -v

  # Terraform configuration checks do not contact AWS or read remote state.
  # Provisioning and deployment are manual operations; see deploy/terraform/README.md.
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.7.5"

      - name: Terraform Init (without backend)
        working-directory: deploy/terraform/environments/dev
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        working-directory: deploy/terraform/environments/dev
        run: terraform validate -no-color
